<!doctype html>
<!-- 테마 색 조합 편집기. coz 폴더에서 로컬 서버를 띄우고 /claude-theme/editor.html로 연다(팔레트 색을 ../palettes에서 읽는다).
     미리보기는 mockup.html에 스니펫을 그대로 실행해서 칠한다. 앱에 적용될 때와 같은 코드라 따로 색칠 코드를 두지 않는다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>테마 편집기</title>
<style>
  :root { --bg: #f6f6f4; --panel: #fff; --ink: #1d1d1b; --soft: #6b6b66; --line: #e3e2de; --pick: #2f6fdb; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 -apple-system, "Apple SD Gothic Neo", sans-serif; background: var(--bg); color: var(--ink); }
  .app { display: flex; flex-direction: column; height: 100vh; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .bar strong { margin-right: 6px; font-size: 14px; }
  .grow { flex: 1; }
  .saved { color: var(--soft); font-size: 12px; }
  select, input[type=text] { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; color: inherit; background: #fff; }
  button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; font: inherit; color: inherit; background: #fff; cursor: pointer; }
  button:hover { border-color: #c9c8c3; }
  button.main { background: var(--ink); border-color: var(--ink); color: #fff; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 6px 14px; }
  .seg button.on { background: var(--ink); color: #fff; }
  .body { display: flex; flex: 1; min-height: 0; }
  .col { flex: none; overflow-y: auto; padding: 12px; background: var(--panel); border-right: 1px solid var(--line); }
  .slots { width: 310px; }
  .pal { width: 220px; }
  .hint { margin: 0 0 8px; color: var(--soft); font-size: 12px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: 28px 1fr 80px 34px; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  li:hover { background: var(--bg); }
  li.on { background: #e9effb; box-shadow: inset 0 0 0 1px var(--pick); }
  li input[type=color] { width: 28px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; cursor: pointer; }
  li input[type=text] { padding: 4px 6px; font: 12px ui-monospace, Menlo, monospace; }
  .ratio { font: 11px ui-monospace, Menlo, monospace; color: var(--soft); text-align: right; }
  .ratio.low { color: #b3261e; }
  .meta { margin-top: 14px; display: grid; gap: 6px; }
  .meta label { display: grid; gap: 3px; color: var(--soft); font-size: 12px; }
  .pal h3 { margin: 12px 0 6px; font-size: 12px; font-weight: 600; color: var(--soft); }
  .pal h3:first-of-type { margin-top: 0; }
  .chips { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .chip { aspect-ratio: 1; padding: 0; border: 1px solid rgb(0 0 0 / .12); border-radius: 5px; }
  .chip:hover { transform: scale(1.12); border-color: rgb(0 0 0 / .12); }
  .chip.now { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--pick); }
  iframe { flex: 1; min-width: 0; border: 0; background: #fff; }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <strong>테마 편집기</strong>
    <select id="theme" aria-label="테마"></select>
    <div class="seg" id="mode"><button data-mode="day" class="on">낮</button><button data-mode="night">밤</button></div>
    <button id="undo" title="Cmd+Z">되돌리기</button>
    <button id="reset">처음 값으로</button>
    <span class="saved" id="saved"></span>
    <span class="grow"></span>
    <button id="copyCode" title="저장소의 THEME_LIST, THEMES에 넣을 코드">테마 코드 복사</button>
    <button id="copyAll" class="main" title="이 테마가 들어간 스니펫 전체. 앱 개발자 도구의 스니펫에 통째로 붙여 넣는다">앱에 붙일 스니펫 복사</button>
  </header>
  <div class="body">
    <section class="col slots">
      <p class="hint">칸을 누르거나, 오른쪽 미리보기에서 바꿀 곳을 바로 눌러요. 숫자는 글자 대비(4.5 이상이면 잘 읽혀요).</p>
      <ul id="slots"></ul>
      <div class="meta">
        <label>테마 이름<input type="text" id="name"></label>
        <label>설명<input type="text" id="desc"></label>
      </div>
    </section>
    <section class="col pal">
      <p class="hint">누르면 고른 칸에 바로 들어가요.</p>
      <div id="palettes"></div>
    </section>
    <iframe id="view" src="mockup.html?theme=off&mode=light" title="미리보기"></iframe>
  </div>
</div>
<script>
  const SLOTS = [
    ['page', '대화 바탕'], ['sunken', '사이드바(움푹한 면)'], ['raised', '입력창, 메뉴, 카드'], ['field', '입력칸'],
    ['text', '본문 글자'], ['textSoft', '보조 글자, 아이콘'], ['textFaint', '흐린 글자'], ['line', '구분선'],
    ['button', '버튼, 링크'], ['buttonHover', '버튼 hover'], ['onButton', '버튼 위 글자'], ['picked', '선택된 목록 줄'],
    ['tint', '내 메시지 말풍선'], ['spark', '글자 선택, 강조 표시'],
  ];
  const READ_ON = { text: 'page', textSoft: 'page', textFaint: 'page', onButton: 'button', tint: 'text' }; // 대비를 잴 짝(말풍선은 그 위 본문 글자)
  const PALETTE_DIR = '../palettes/';
  // 스니펫이 화면을 건드리기 전에 끼어드는 자리. check.mjs도 같은 줄을 쓴다.
  const HOOK = '  if (!THEMES[PICK])';
  const DRAFT = (name) => `claude-theme-editor:${name}`;

  const $ = (id) => document.getElementById(id);
  const frame = $('view');
  let snippet, list, themes, current, work, mode = 'day', selected = 'page', rows = [];
  let history = [], lastSnap = 0;

  const lum = (hex) => {
    const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255)
      .map((v) => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  };
  const contrast = (a, b) => {
    const [hi, lo] = [lum(a), lum(b)].sort((x, y) => y - x);
    return (hi + 0.05) / (lo + 0.05);
  };

  // 편집 중인 테마 = 색 + 이름 + 설명. 브라우저에 자동 저장해서 새로 고쳐도 남는다.
  const meta = () => ({ id: $('name').value.trim() || current, desc: $('desc').value });
  const save = () => {
    try { localStorage.setItem(DRAFT(current), JSON.stringify({ work, ...meta() })); $('saved').textContent = '자동 저장됨'; } catch {}
  };
  const draft = (name) => {
    try { return JSON.parse(localStorage.getItem(DRAFT(name))); } catch { return null; }
  };

  // 미리보기: 편집 중인 색을 __edit 테마로 끼워 넣고 스니펫을 mockup 안에서 실행한다
  const paint = () => {
    frame.contentDocument.documentElement.dataset.mode = mode === 'day' ? 'light' : 'dark';
    frame.contentWindow.eval(snippet
      .replace(/const PICK = '[\w-]+'/, "const PICK = '__edit'")
      .replace(HOOK, `  THEMES.__edit = ${JSON.stringify(work)};\n${HOOK}`));
  };
  const outline = (cls, slot) => {
    const doc = frame.contentDocument;
    doc.querySelectorAll(`.${cls}`).forEach((el) => el.classList.remove(cls));
    if (slot) doc.querySelectorAll(`[data-slot="${slot}"]`).forEach((el) => el.classList.add(cls));
  };

  const update = () => {
    const c = work[mode];
    for (const { k, li, picker, hex, ratio } of rows) {
      li.classList.toggle('on', k === selected);
      if (document.activeElement !== picker) picker.value = c[k].toLowerCase();
      if (document.activeElement !== hex) hex.value = c[k];
      const r = READ_ON[k] ? contrast(c[k], c[READ_ON[k]]) : null;
      ratio.textContent = r === null ? '' : r.toFixed(1);
      ratio.classList.toggle('low', r !== null && r < 4.5);
    }
    document.querySelectorAll('.chip').forEach((b) => b.classList.toggle('now', b.dataset.hex === c[selected]));
    $('undo').disabled = !history.length;
    paint();
    outline('slot-on', selected);
  };

  const select = (k) => {
    selected = k;
    update();
    rows.find((r) => r.k === k)?.li.scrollIntoView({ block: 'nearest' });
  };
  // 색 고르기 창을 끄는 동안 나오는 연속 변경은 되돌리기 한 번에 묶는다
  const setColor = (k, hex) => {
    if (Date.now() - lastSnap > 600) history.push(JSON.stringify(work));
    lastSnap = Date.now();
    work[mode][k] = hex.toUpperCase();
    save();
    update();
  };
  const undo = () => {
    if (!history.length) return;
    work = JSON.parse(history.pop());
    save();
    update();
  };

  // 칸 줄은 테마나 낮밤이 바뀔 때만 새로 만든다. 색만 바뀔 때 다시 만들면 고르던 색 선택 창이 닫힌다.
  const render = () => {
    rows = SLOTS.map(([k, label]) => {
      const li = document.createElement('li');
      li.innerHTML = `<input type="color" aria-label="${label}"><span>${label}</span><input type="text" aria-label="${label} 색 코드"><span class="ratio"></span>`;
      const [picker, hex] = li.querySelectorAll('input');
      li.onclick = () => select(k);
      li.onmouseenter = () => outline('slot-hover', k);
      li.onmouseleave = () => outline('slot-hover');
      picker.oninput = () => setColor(k, picker.value);
      hex.onchange = () => (/^#[0-9a-f]{6}$/i.test(hex.value) ? setColor(k, hex.value) : (hex.value = work[mode][k]));
      return { k, li, picker, hex, ratio: li.lastChild };
    });
    $('slots').replaceChildren(...rows.map((r) => r.li));
    update();
  };

  const load = (name, fresh = false) => {
    current = name;
    const d = fresh ? null : draft(name);
    work = d?.work ?? structuredClone(themes[name]);
    $('name').value = d?.id ?? name;
    $('desc').value = d?.desc ?? list[name];
    $('saved').textContent = d ? '자동 저장본을 불러왔어요' : '';
    history = [];
    render();
  };

  const themeCode = () => {
    const { id, desc } = meta();
    const key = (k) => (/^[a-z_$][\w$]*$/i.test(k) ? k : `'${k}'`);
    const colors = (o) => {
      const parts = SLOTS.map(([k]) => `${k}: '${o[k]}'`);
      const lines = [];
      for (let i = 0; i < parts.length; i += 4) lines.push(`    ${parts.slice(i, i + 4).join(', ')},`);
      return `{\n${lines.join('\n')}\n  }`;
    };
    return ['// THEME_LIST에 넣을 줄', `${key(id)}: '${desc.replace(/'/g, "\\'")}',`, '', '// THEMES에 넣을 덩어리',
      `${key(id)}: {`, `  day: ${colors(work.day)},`, `  night: ${colors(work.night)},`, '},'].join('\n');
  };
  // 이 테마가 들어가고 PICK도 이 테마로 바뀐 스니펫 전체. 앱 개발자 도구에 통째로 붙여 넣으면 된다.
  const fullSnippet = () => {
    const { id, desc } = meta();
    return snippet
      .replace(/const PICK = '[\w-]+'/, `const PICK = ${JSON.stringify(id)}`)
      .replace(HOOK, `  // 테마 편집기에서 만든 테마\n  THEME_LIST[${JSON.stringify(id)}] = ${JSON.stringify(desc)};\n  THEMES[${JSON.stringify(id)}] = ${JSON.stringify(work)};\n${HOOK}`);
  };
  const copy = async (button, text) => {
    const label = button.textContent;
    await navigator.clipboard.writeText(text);
    button.textContent = '복사됨';
    setTimeout(() => (button.textContent = label), 1500);
  };

  // palettes 폴더의 md 파일을 전부 읽는다(서버의 폴더 목록에서 찾으니 팔레트가 늘어도 손댈 곳이 없다).
  // 문서 표 줄(| ... | `#RRGGBB` | 이름 |)에서 색과 이름을, 첫 제목 줄에서 묶음 이름을 뽑는다. 못 읽으면 테마에 쓰인 색만 보여 준다.
  const loadPalettes = async () => {
    let files = [];
    try {
      const index = await fetch(PALETTE_DIR).then((r) => (r.ok ? r.text() : ''));
      files = [...new Set([...index.matchAll(/href="([^"?#]+\.md)"/g)].map((m) => m[1]))];
    } catch {}
    const groups = await Promise.all(files.map(async (file) => {
      try {
        const md = await fetch(PALETTE_DIR + file).then((r) => (r.ok ? r.text() : ''));
        const title = md.match(/^#\s+(.+)$/m)?.[1] ?? decodeURIComponent(file);
        const seen = new Map();
        for (const [, hex, name] of md.matchAll(/\|\s*`(#[0-9A-Fa-f]{6})`\s*\|\s*([^|]*?)\s*\|/g)) if (!seen.has(hex.toUpperCase())) seen.set(hex.toUpperCase(), name);
        return [title, [...seen]];
      } catch { return [file, []]; }
    }));
    if (groups.every(([, c]) => !c.length)) {
      const used = new Set(Object.values(themes).flatMap((t) => [...Object.values(t.day), ...Object.values(t.night)]));
      groups.splice(0, groups.length, ['테마에 쓰인 색', [...used].map((h) => [h, h])]);
    }
    $('palettes').replaceChildren(...groups.filter(([, c]) => c.length).flatMap(([title, chips]) => {
      const h = document.createElement('h3');
      h.textContent = title;
      const box = document.createElement('div');
      box.className = 'chips';
      box.append(...chips.map(([hex, name]) => {
        const b = document.createElement('button');
        b.className = 'chip';
        b.style.background = hex;
        b.dataset.hex = hex;
        b.title = `${name} ${hex}`;
        b.onclick = () => setColor(selected, hex);
        return b;
      }));
      return [h, box];
    }));
    update();
  };

  // 미리보기에서 누른 곳의 색 칸을 고른다(mockup.html의 data-slot)
  const wirePreview = () => {
    const doc = frame.contentDocument;
    const style = doc.createElement('style');
    style.textContent = '[data-slot] { cursor: pointer; } .slot-hover { outline: 2px dashed #2f6fdb; outline-offset: 2px; } .slot-on { outline: 2px solid #2f6fdb; outline-offset: 2px; }';
    doc.head.append(style);
    doc.addEventListener('mouseover', (e) => outline('slot-hover', e.target.closest('[data-slot]')?.dataset.slot));
    doc.addEventListener('mouseleave', () => outline('slot-hover'));
    doc.addEventListener('click', (e) => {
      const slot = e.target.closest('[data-slot]')?.dataset.slot;
      e.preventDefault();
      if (slot) select(slot);
    });
    doc.addEventListener('keydown', onKey);
  };
  const onKey = (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !e.shiftKey && !(e.target instanceof HTMLInputElement)) { e.preventDefault(); undo(); }
  };

  (async () => {
    snippet = await fetch('claude-theme.snippet.js').then((r) => r.text());
    let pick;
    ({ THEME_LIST: list, THEMES: themes, PICK: pick } = (0, eval)(snippet.replace(HOOK, `  return { THEME_LIST, THEMES, PICK };\n${HOOK}`)));
    $('theme').append(...Object.entries(list).map(([id, about]) => Object.assign(new Option(id, id), { title: about })));
    $('theme').onchange = () => load($('theme').value);
    $('mode').onclick = (e) => {
      if (!e.target.dataset.mode) return;
      mode = e.target.dataset.mode;
      for (const b of $('mode').children) b.classList.toggle('on', b === e.target);
      update();
    };
    $('name').oninput = $('desc').oninput = save;
    $('undo').onclick = undo;
    $('reset').onclick = () => {
      try { localStorage.removeItem(DRAFT(current)); } catch {}
      load(current, true);
    };
    $('copyCode').onclick = () => copy($('copyCode'), themeCode());
    $('copyAll').onclick = () => copy($('copyAll'), fullSnippet());
    document.addEventListener('keydown', onKey);
    const ready = () => frame.contentDocument?.URL.includes('mockup') && frame.contentDocument.readyState === 'complete';
    if (!ready()) await new Promise((ok) => frame.addEventListener('load', ok, { once: true }));
    wirePreview();
    const start = list[pick] ? pick : Object.keys(list)[0];
    $('theme').value = start;
    load(start);
    loadPalettes();
  })();
</script>
</body>
</html>
